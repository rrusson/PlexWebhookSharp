<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Plex Webhook Tester</title>
    <style>
        :root {
            color-scheme: light dark;
            font-family: system-ui, sans-serif;
        }

        body {
            margin: 0 auto;
            max-width: 50rem;
            padding: 2rem 1rem;
        }

        label {
            display: block;
            font-weight: 600;
            margin-top: 1rem;
        }

        input,
        textarea,
        button {
            box-sizing: border-box;
            font: inherit;
            margin-top: 0.35rem;
            width: 100%;
        }

        input,
        textarea {
            padding: 0.55rem;
        }

        textarea {
            min-height: 16rem;
            resize: vertical;
        }

        .actions {
            display: grid;
            gap: 0.75rem;
            grid-template-columns: repeat(auto-fit, minmax(13rem, 1fr));
            margin-top: 1rem;
        }

        button {
            cursor: pointer;
            padding: 0.65rem;
        }

        pre {
            border: 1px solid currentColor;
            overflow-wrap: anywhere;
            padding: 1rem;
            white-space: pre-wrap;
        }
    </style>
</head>

<body>
    <h1>Plex Webhook Tester</h1>
    <p>Use this page to send representative Plex webhook requests to the running local API.</p>

    <label for="endpoint">Webhook endpoint</label>
    <input id="endpoint" type="url">

    <label for="secret">Webhook secret</label>
    <input id="secret" type="password" autocomplete="off">

    <label for="payload">Payload JSON</label>
    <textarea id="payload" spellcheck="false"></textarea>

    <div class="actions">
        <button type="button" data-event="media.play">Send media.play (captured)</button>
        <button type="button" data-event="media.pause">Send media.pause (ignored)</button>
        <button type="button" id="send-malformed">Send malformed JSON (ignored)</button>
        <button type="button" id="send-without-secret">Send without secret (401)</button>
    </div>

    <h2>Response</h2>
    <pre id="response" aria-live="polite">No request has been sent.</pre>

    <script>
        const endpointInput = document.getElementById("endpoint");
        const secretInput = document.getElementById("secret");
        const payloadInput = document.getElementById("payload");
        const responseOutput = document.getElementById("response");

        const createPayload = (eventType) => JSON.parse(getFakePayload(eventType));

        endpointInput.value = `${window.location.origin}/webhooks/plex`;
        payloadInput.value = JSON.stringify(createPayload("media.play"), null, 2);

        async function sendRequest({ includeSecret, rawPayload }) {
            const endpoint = endpointInput.value.trim();

            if (!endpoint) {
                responseOutput.textContent = "Enter a webhook endpoint.";
                return;
            }

            const headers = {};
            const secret = secretInput.value;

            if (includeSecret && secret) {
                headers["X-Plex-Webhook-Secret"] = secret;
            }

            const request = {
                method: "POST",
                headers
            };

            if (rawPayload) {
                headers["Content-Type"] = "application/json";
                request.body = payloadInput.value;
            } else {
                const form = new FormData();
                form.append("payload", payloadInput.value);
                form.append("thumb", new Blob(["test thumbnail"], { type: "text/plain" }), "thumbnail.txt");
                request.body = form;
            }

            responseOutput.textContent = "Sending request...";

            try {
                const response = await fetch(endpoint, request);
                const body = await response.text();
                responseOutput.textContent = `${response.status} ${response.statusText}\n${body || "(empty response)"}`;
            } catch (error) {
                responseOutput.textContent = `Request failed: ${error instanceof Error ? error.message : String(error)}`;
            }
        }

        for (const button of document.querySelectorAll("[data-event]")) {
            button.addEventListener("click", () => {
                payloadInput.value = JSON.stringify(createPayload(button.dataset.event), null, 2);
                sendRequest({ includeSecret: true, rawPayload: false });
            });
        }

        document.getElementById("send-malformed").addEventListener("click", () => {
            payloadInput.value = "{ invalid JSON";
            sendRequest({ includeSecret: true, rawPayload: true });
        });

        document.getElementById("send-without-secret").addEventListener("click", () => {
            sendRequest({ includeSecret: false, rawPayload: false });
        });

        function getFakePayload(eventType) {
            return `
{
   "event": ${JSON.stringify(eventType)},
   "user": true,
   "owner": true,
   "Account": {
      "id": 1,
      "thumb": "https://plex.tv/users/1022b120ffbaa/avatar?c=1465525047",
      "title": "tacoded"
   },
   "Server": {
      "title": "Office",
      "uuid": "54664a3d8acc39983675640ec9ce00b70af9cc36"
   },
   "Player": {
      "local": true,
      "publicAddress": "200.200.200.200",
      "title": "Plex Web (Safari)",
      "uuid": "r6yfkdnfggbh2bdnvkffwbms"
   },
   "Metadata": {
      "librarySectionType": "artist",
      "ratingKey": "1936545",
      "key": "/library/metadata/1936545",
      "parentRatingKey": "1936544",
      "grandparentRatingKey": "1936543",
      "guid": "com.plexapp.agents.plexmusic://gracenote/track/7572499?lang=en",
      "librarySectionID": 1224,
      "type": "track",
      "title": "Love The One You're With",
      "grandparentKey": "/library/metadata/1936543",
      "parentKey": "/library/metadata/1936544",
      "grandparentTitle": "Stephen Stills",
      "parentTitle": "Stephen Stills",
      "summary": "",
      "index": 1,
      "parentIndex": 1,
      "ratingCount": 6794,
      "thumb": "/library/metadata/1936544/thumb/1432897518",
      "art": "/library/metadata/1936543/art/1485951497",
      "parentThumb": "/library/metadata/1936544/thumb/1432897518",
      "grandparentThumb": "/library/metadata/1936543/thumb/1485951497",
      "grandparentArt": "/library/metadata/1936543/art/1485951497",
      "addedAt": 1000396126,
      "updatedAt": 1432897518
   }
}
`;
        }

    </script>
</body>

</html>
